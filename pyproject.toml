[project]
name = "data4cvlab"
version = "0.1.0"
description = "Data-centric computer vision learning and research workspace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

